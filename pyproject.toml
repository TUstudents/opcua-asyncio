[project]
name = "enginir-opcua"
version = "3.0.0rc3"
description = "OPC UA client and server library for Python, built on asyncio; a fork of opcua-asyncio"
readme = "README.md"
requires-python = ">=3.12"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.GPL", "NOTICE"]
authors = [
  { name = "engiNIR-OPCUA contributors" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "aiosqlite",
  "anyio",
  "cryptography>=45.0.0",
  "python-dateutil",
  "pytz",
  "sortedcontainers",
  "typing-extensions",
]

[project.urls]
Homepage = "https://github.com/TUstudents/engiNIR-OPCUA"
Documentation = "https://enginir-opcua.readthedocs.io/en/latest/"
Repository = "https://github.com/TUstudents/engiNIR-OPCUA"
Upstream = "https://github.com/FreeOpcUa/opcua-asyncio"

[project.scripts]
enginir-opcua = "enginir_opcua.tools:cli"
enginir-uabrowse = "enginir_opcua.tools:uabrowse"
enginir-uacall = "enginir_opcua.tools:uacall"
enginir-uaclient = "enginir_opcua.tools:uaclient"
enginir-uadiscover = "enginir_opcua.tools:uadiscover"
enginir-uageneratestructs = "enginir_opcua.tools:uageneratestructs"
enginir-uahistoryread = "enginir_opcua.tools:uahistoryread"
enginir-uals = "enginir_opcua.tools:uals"
enginir-uaread = "enginir_opcua.tools:uaread"
enginir-uaserver = "enginir_opcua.tools:uaserver"
enginir-uasubscribe = "enginir_opcua.tools:uasubscribe"
enginir-uawrite = "enginir_opcua.tools:uawrite"

[dependency-groups]
dev = [
  "asynctest",
  "coverage",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-mock",
  "pytest-profiling",
  "pytest-repeat",
  "pytest-xdist",
  "ruff",
  "types-python-dateutil",
  "types-pytz",
]
docs = [
  "pydata-sphinx-theme>=0.16",
  "sphinx>=8.1",
  "sphinx-autobuild>=2024.10.3",
  "sphinx-design>=0.6",
]

[build-system]
requires = ["uv_build>=0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "enginir_opcua"
module-root = ""

[tool.mypy]
disable_error_code = ["misc", "arg-type", "assignment", "var-annotated"]
check_untyped_defs = false

[[tool.mypy.overrides]]
# Autogenerated file
module = "enginir_opcua.ua.uaprotocol_auto.*"
disable_error_code = ["literal-required", "name-defined"]

[[tool.mypy.overrides]]
module = [
  "enginir_opcua.common.connection",
  "enginir_opcua.common.conditions",
  "enginir_opcua.common.events",
  "enginir_opcua.common.programs",
  "enginir_opcua.common.statemachine",
  "enginir_opcua.common.callback",
  "enginir_opcua.common.copy_node_util",
  "enginir_opcua.common.instantiate_util",
  "enginir_opcua.common.manage_nodes",
  "enginir_opcua.common.methods",
  "enginir_opcua.common.node",
  "enginir_opcua.common.node_factory",
  "enginir_opcua.common.session_interface",
  "enginir_opcua.common.shortcuts",
  "enginir_opcua.common.sql_injection",
  "enginir_opcua.common.ua_utils",
  "enginir_opcua.common.utils",
  "enginir_opcua.common.structures",
  "enginir_opcua.common.structures104",
  "enginir_opcua.common.type_dictionary_builder",
  "enginir_opcua.common.xmlexporter",
  "enginir_opcua.common.xmlimporter",
  "enginir_opcua.common.xmlparser",
  "enginir_opcua.crypto.*",
  "enginir_opcua.ua.attribute_ids",
  "enginir_opcua.ua.numeric_range",
  "enginir_opcua.ua.relative_path",
  "enginir_opcua.ua.ua_binary",
  "enginir_opcua.ua.uaerrors.*",
  "enginir_opcua.ua.uaprotocol_hand",
  "enginir_opcua.ua.uatypes",
]
check_untyped_defs = true
enable_error_code = ["misc", "arg-type", "assignment", "var-annotated"]

[[tool.mypy.overrides]]
module = "enginir_opcua.client.*"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "asynctest.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiosqlite.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
log_cli = false
log_level = "INFO"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "module"
asyncio_default_fixture_loop_scope = "module"
markers = [
  "slow(*paths): slow test; with --changed-since REF it only runs when one of the given source paths, its test file or tests/conftest.py changed",
  "interop: runs against the OPC Foundation reference stack; only selected with -m interop and needs ENGINIR_INTEROP_SERVER_URL or ENGINIR_INTEROP_CLIENT_DLL (see tools/interop/run.sh)",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  "docs",
  "nodeset",
  "schemas",
  "*_auto.py",
  "event_objects.py",
  "standard_address_space_services*.py",
  "enginir_opcua/ua/object_ids.py",
  "enginir_opcua/ua/status_codes.py",
]

[tool.ruff.lint]
select = [
  "ANN",
  "E",
  "F",
  "G004",
  "W",
  "UP",
  "YTT",
  "ASYNC",
  "T10",
  "ISC",
  "G",
  "PIE",
  "RET",
  "INT",
  "RUF",
  "PLE",
  "I",
]
ignore = [
  "E111",  # conflicts with ruff format, cf doc
  "E114",  # conflicts with ruff format, cf doc
  "E117",  # conflicts with ruff format, cf doc
  "E501",  # conflicts with ruff format, cf doc
  "UP032",  # Use f-string instead of `format` call
  "UP030",  # Use implicit references for positional format fields
  "UP037",  # due to protocol using class member name same as object type we want to use quotes and precise ua namespace
  "ASYNC110",  # too many false positives
  "RET504",  # do not agree
  "RUF015",  # Not sure
  "ANN401",  # typing.Any is legitimate in many places
  "ASYNC109",  # request timeouts are part of the public OPC UA client API
  "UP042",  # StrEnum changes str() of public enums such as observer.SubscriptionEvent
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["ANN", "F401", "F403", "I"]
"examples/*" = ["ANN", "F841", "E402"]
"tests/**" = ["ANN"]

# Autogenerated files (header marks them as such even when name doesn't end in _auto)
"enginir_opcua/ua/uaprotocol_auto.py" = ["ANN"]
"enginir_opcua/ua/uaerrors/**" = ["ANN"]
"enginir_opcua/ua/status_codes.py" = [
  "ANN",
  "RUF001"
]  # we get some crappy chars from spec
"enginir_opcua/ua/object_ids.py" = ["ANN"]
"enginir_opcua/ua/attribute_ids.py" = ["ANN"]
"enginir_opcua/pubsub/**" = ["ANN"]
"enginir_opcua/server/standard_address_space/**" = ["ANN"]
"enginir_opcua/common/event_objects.py" = ["ANN"]
# Non-typed files still needing work
"enginir_opcua/client/ha/**" = ["ANN"]
"enginir_opcua/server/uaprocessor.py" = ["ANN"]
